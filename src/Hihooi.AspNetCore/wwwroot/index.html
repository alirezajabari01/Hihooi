<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Hihooi Observability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hihooi-dashboard-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    :root, html[data-theme="dark"] {
      --bg: #0e1412; --bg-elev: #161d1a; --bg-sunken: #0a0f0d; --bg-hover: #1e2823;
      --line: #2a3630; --text: #e8eeea; --muted: #8fa398;
      --accent: #3dba8c; --accent-soft: rgba(61,186,140,.14);
      --ok: #3cba6f; --warn: #e0a24a; --err: #f07167;
      --bar: #3dba8c; --bar-err: #f07167; --bar-track: #24302b;
      color-scheme: dark;
    }
    html[data-theme="light"] {
      --bg: #f2f5f2; --bg-elev: #fff; --bg-sunken: #e6ebe7; --bg-hover: #edf1ee;
      --line: #d0d8d2; --text: #14201a; --muted: #5a6b62;
      --accent: #0f7a4a; --accent-soft: rgba(15,122,74,.1);
      --ok: #0f7a3a; --warn: #9a6408; --err: #b42318;
      --bar: #0f7a4a; --bar-err: #b42318; --bar-track: #dce4de;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(61,186,140,.08), transparent 55%),
        var(--bg);
      color: var(--text); font-size: 14px; line-height: 1.45;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
    [hidden] { display: none !important; }
    .app { display: grid; grid-template-columns: 220px minmax(0,1fr); min-height: 100vh; }
    .side {
      background: var(--bg-sunken); border-right: 1px solid var(--line);
      padding: 18px 12px 24px; position: sticky; top: 0; height: 100vh; overflow: auto;
    }
    .brand {
      font-family: Fraunces, Georgia, serif; font-size: 1.45rem; font-weight: 700;
      letter-spacing: -.02em; margin: 0 8px 4px; color: var(--accent);
    }
    .brand-sub { margin: 0 8px 18px; font-size: 12px; color: var(--muted); }
    .nav button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 9px 12px; border-radius: 8px; margin-bottom: 2px; color: var(--muted);
    }
    .nav button:hover { background: var(--bg-hover); color: var(--text); }
    .nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .main { min-width: 0; display: flex; flex-direction: column; }
    header.top {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      padding: 14px 22px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--line); font-size: 12px; color: var(--muted);
    }
    .pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .content { padding: 22px; max-width: 1400px; }
    h1 { font-family: Fraunces, Georgia, serif; font-size: 1.55rem; margin: 0 0 6px; font-weight: 700; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: 16px 0; }
    .card {
      background: var(--bg-elev); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    }
    .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .card .v { font-size: 1.35rem; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-elev); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    tr:hover td { background: var(--bg-hover); }
    tr.clickable { cursor: pointer; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
    .filters input, .filters select, .icon-btn, .btn {
      background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    }
    .btn.primary { background: var(--accent); color: #04140e; border-color: transparent; font-weight: 600; }
    .icon-btn { padding: 6px 10px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: var(--accent-soft); color: var(--accent);
    }
    .badge.err { background: rgba(240,113,103,.15); color: var(--err); }
    .badge.warn { background: rgba(224,162,74,.15); color: var(--warn); }
    .badge.ok { background: rgba(60,186,111,.15); color: var(--ok); }
    .waterfall { margin-top: 12px; }
    .wf-row { display: grid; grid-template-columns: 220px 1fr 72px; gap: 10px; align-items: center; margin: 6px 0; }
    .wf-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
    .wf-track { height: 18px; background: var(--bar-track); border-radius: 4px; position: relative; overflow: hidden; }
    .wf-bar {
      position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: var(--bar); min-width: 2px;
      transition: width .25s ease;
    }
    .wf-bar.err { background: var(--bar-err); }
    .wf-bar:hover { filter: brightness(1.15); }
    .split { display: grid; grid-template-columns: 1.4fr .9fr; gap: 14px; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .side { position: relative; height: auto; }
      .split { grid-template-columns: 1fr; }
    }
    pre.code {
      margin: 0; padding: 12px; background: var(--bg-sunken); border-radius: 8px; overflow: auto;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.5; max-height: 280px;
    }
    .route-flow { display: flex; flex-direction: column; gap: 6px; }
    .route-node {
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg-sunken);
      font-size: 12px;
    }
    .route-node.selected { border-color: var(--accent); background: var(--accent-soft); }
    .route-node.rejected { opacity: .72; }
    .keybar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .keybar input { min-width: 180px; }
    .empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
    .detail-panel { position: sticky; top: 72px; }
    .span-selected { outline: 1px solid var(--accent); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">Hihooi</div>
      <p class="brand-sub">Observability</p>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="main">
      <header class="top">
        <div>
          <div id="pageTitle" style="font-weight:600">Overview</div>
          <div class="muted" id="pageSub" style="font-size:12px">Live engine telemetry</div>
        </div>
        <div class="keybar">
          <span class="pill" id="connPill">Connecting</span>
          <input id="apiKey" type="password" placeholder="Dashboard API key" />
          <button class="icon-btn" id="saveKey">Save key</button>
          <button class="icon-btn" id="themeBtn" title="Toggle theme">Theme</button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script>
(function () {
  const BASE = '__HIHOOI_BASE__';
  const PAGES = [
    ['overview', 'Overview'],
    ['nodes', 'Nodes'],
    ['traffic', 'Live Traffic'],
    ['tracing', 'Request Tracing'],
    ['trace', 'Trace Detail'],
    ['replication', 'Replication'],
    ['analytics', 'Query Analytics'],
    ['consistency', 'Consistency'],
    ['connections', 'Connections'],
    ['events', 'Errors & Events'],
    ['health', 'Health Checks'],
    ['config', 'Configuration']
  ];
  let page = 'overview';
  let selectedTraceId = null;
  let selectedSpanId = null;
  let trafficCache = [];
  let live = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtMs = (v) => v == null ? '—' : (Number(v).toFixed(Number(v) < 10 ? 2 : 1) + ' ms');
  const fmtTime = (v) => v ? new Date(v).toLocaleTimeString() : '—';
  const statusBadge = (s) => {
    const u = String(s || '').toLowerCase();
    const cls = u.includes('error') || u === 'unhealthy' || u === 'offline' ? 'err'
      : u.includes('degraded') || u.includes('warn') ? 'warn' : 'ok';
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  };

  function apiKey() { try { return sessionStorage.getItem('hihooi-dashboard-key') || ''; } catch { return ''; } }
  function headers() {
    const h = { 'Accept': 'application/json' };
    const k = apiKey();
    if (k) h['X-Hihooi-Dashboard-Key'] = k;
    return h;
  }
  async function fetchJson(url) {
    const res = await fetch(url, { headers: headers() });
    let body = null;
    try { body = await res.json(); } catch { body = null; }
    return { status: res.status, body };
  }

  function renderNav() {
    $('nav').innerHTML = PAGES.filter(p => p[0] !== 'trace').map(([id, label]) =>
      '<button data-page="' + id + '" class="' + (page === id || (page === 'trace' && id === 'tracing') ? 'active' : '') + '">' + label + '</button>'
    ).join('');
    $('nav').onclick = (e) => {
      const b = e.target.closest('button[data-page]');
      if (!b) return;
      go(b.getAttribute('data-page'));
    };
  }

  function go(p, traceId) {
    page = p;
    if (traceId) selectedTraceId = traceId;
    renderNav();
    paint();
  }

  async function paint() {
    const titles = Object.fromEntries(PAGES);
    $('pageTitle').textContent = titles[page] || page;
    const root = $('content');
    if (page === 'overview') await paintOverview(root);
    else if (page === 'nodes') await paintNodes(root);
    else if (page === 'traffic') await paintTraffic(root);
    else if (page === 'tracing') await paintTracing(root);
    else if (page === 'trace') await paintTrace(root);
    else if (page === 'replication') await paintReplication(root);
    else if (page === 'analytics') await paintAnalytics(root);
    else if (page === 'consistency') await paintConsistency(root);
    else if (page === 'connections') await paintConnections(root);
    else if (page === 'events') await paintEvents(root);
    else if (page === 'health') await paintHealth(root);
    else if (page === 'config') await paintConfig(root);
  }

  function kpi(k, v) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v mono">' + esc(v) + '</div></div>';
  }

  async function paintOverview(root) {
    const res = await fetchJson(BASE + '/api/overview');
    const m = res.body || {};
    if (!m.available) { root.innerHTML = '<div class="empty">' + esc(m.reason || 'Overview unavailable') + '</div>'; return; }
    const a = m.analytics || {};
    root.innerHTML =
      '<h1>Overview</h1><p class="muted">Engine counters and percentiles from recorded traces only.</p>' +
      '<div class="grid">' +
        kpi('Commits', m.commits) + kpi('Rollbacks', m.rollbacks) +
        kpi('Primary reads', m.primaryReads) + kpi('Extension reads', m.extensionReads) +
        kpi('Fallbacks', m.primaryFallbacks) + kpi('Latest TSID', m.latestTsId) +
        kpi('Nodes healthy-ish', (m.nodesOnline ?? 0) + ' / ' + (m.nodesTotal ?? 0)) +
        kpi('P95', a.p95Ms != null ? fmtMs(a.p95Ms) : '—') +
        kpi('Failed traces', a.failed ?? 0) +
      '</div>';
  }

  async function paintNodes(root) {
    const res = await fetchJson(BASE + '/api/nodes');
    const nodes = (res.body || []);
    root.innerHTML = '<h1>Nodes</h1><p class="muted">All primary and extension endpoints. Health comes from probes, not traffic.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Role</th><th>Health</th><th>Latency</th><th>Lag</th><th>Reads</th><th>Failures</th><th>Server</th></tr></thead><tbody>' +
      nodes.map(n => '<tr><td class="mono">' + esc(n.id) + '</td><td>' + esc(n.role) + '</td><td>' + statusBadge(n.healthStatus) +
        '</td><td class="mono">' + fmtMs(n.latencyMs) + '</td><td class="mono">' + esc(n.lag ?? '—') +
        '</td><td class="mono">' + esc(n.successfulReads) + '</td><td class="mono">' + esc(n.applyFailures) +
        '</td><td class="mono">' + esc(n.server || '—') + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  function trafficFiltersHtml() {
    return '<div class="filters">' +
      '<input id="fTrace" placeholder="Trace ID" />' +
      '<select id="fKind"><option value="">All kinds</option><option>Read</option><option>Write</option><option>ReplicationApply</option></select>' +
      '<select id="fStatus"><option value="">All status</option><option>Ok</option><option>Error</option></select>' +
      '<input id="fNode" placeholder="Node id" />' +
      '<select id="fInflight"><option value="">All</option><option value="false">Completed</option><option value="true">In flight</option></select>' +
      '<input id="fMinMs" type="number" placeholder="Min ms" style="width:90px" />' +
      '<button class="btn primary" id="fApply">Apply</button></div>';
  }

  async function loadTraffic() {
    const q = new URLSearchParams();
    q.set('take', '100');
    const kind = $('fKind')?.value; if (kind) q.set('kind', kind);
    const status = $('fStatus')?.value; if (status) q.set('status', status);
    const node = $('fNode')?.value; if (node) q.set('nodeId', node);
    const tid = $('fTrace')?.value; if (tid) q.set('traceId', tid);
    const inf = $('fInflight')?.value; if (inf) q.set('inFlight', inf);
    const min = $('fMinMs')?.value; if (min) q.set('minDurationMs', min);
    const res = await fetchJson(BASE + '/api/traffic?' + q.toString());
    trafficCache = (res.body && res.body.items) || [];
    return trafficCache;
  }

  function trafficTable(items) {
    if (!items.length) return '<div class="empty">No recorded requests yet. Execute SQL through IHihooiDatabase to populate traces.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Trace</th><th>Op</th><th>Kind</th><th>Node</th><th>Consistency</th><th>Duration</th><th>Status</th></tr></thead><tbody>' +
      items.map(t => '<tr class="clickable" data-tid="' + esc(t.traceId) + '"><td class="mono">' + esc(fmtTime(t.startUtc)) +
        '</td><td class="mono">' + esc((t.traceId || '').slice(0, 12)) + '…</td><td>' + esc(t.operation) +
        '</td><td>' + esc(t.kind) + '</td><td class="mono">' + esc(t.selectedNodeId || '—') +
        '</td><td>' + esc(t.consistencyMode || '—') + '</td><td class="mono">' + fmtMs(t.durationMs) +
        '</td><td>' + statusBadge(t.status) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  async function paintTraffic(root) {
    root.innerHTML = '<h1>Live Traffic</h1><p class="muted">Requests recorded by the Hihooi tracer.</p>' + trafficFiltersHtml() + '<div id="trafficBody"></div>';
    const render = async () => {
      const items = await loadTraffic();
      $('trafficBody').innerHTML = trafficTable(items);
      $('trafficBody').onclick = (e) => {
        const tr = e.target.closest('tr[data-tid]');
        if (tr) go('trace', tr.getAttribute('data-tid'));
      };
    };
    $('fApply').onclick = render;
    await render();
  }

  async function paintTracing(root) {
    const res = await fetchJson(BASE + '/api/traces?take=80');
    const items = (res.body && res.body.items) || [];
    root.innerHTML = '<h1>Request Tracing</h1><p class="muted">Open a trace for the full waterfall.</p>' + trafficTable(items);
    root.onclick = (e) => {
      const tr = e.target.closest('tr[data-tid]');
      if (tr) go('trace', tr.getAttribute('data-tid'));
    };
  }

  async function paintTrace(root) {
    if (!selectedTraceId) {
      root.innerHTML = '<div class="empty">Select a request from Live Traffic or Request Tracing.</div>';
      return;
    }
    const res = await fetchJson(BASE + '/api/traces/' + encodeURIComponent(selectedTraceId));
    const t = res.body;
    if (!t || !t.available) {
      root.innerHTML = '<div class="empty">Trace not found: ' + esc(selectedTraceId) + '</div>';
      return;
    }
    const spans = t.spans || [];
    const t0 = new Date(t.startUtc).getTime();
    const total = Math.max(t.durationMs || 1, ...spans.map(s => {
      const start = new Date(s.startUtc).getTime() - t0;
      return start + (s.durationMs || 0);
    }), 1);

    const waterfall = spans.map(s => {
      const start = Math.max(0, new Date(s.startUtc).getTime() - t0);
      const left = (start / total) * 100;
      const width = Math.max(0.4, ((s.durationMs || 0) / total) * 100);
      const err = String(s.status).toLowerCase() === 'error';
      return '<div class="wf-row' + (selectedSpanId === s.spanId ? ' span-selected' : '') + '" data-sid="' + esc(s.spanId) + '">' +
        '<div class="wf-name mono" title="' + esc(s.name) + '">' + esc(s.name) +
        '<div class="muted" style="font-size:11px">' + esc(s.component) + (s.nodeId ? ' · ' + esc(s.nodeId) : '') + '</div></div>' +
        '<div class="wf-track"><div class="wf-bar' + (err ? ' err' : '') + '" style="left:' + left + '%;width:' + width + '%"></div></div>' +
        '<div class="mono muted">' + fmtMs(s.durationMs) + '</div></div>';
    }).join('');

    const candidates = (t.routingCandidates || []).map(c =>
      '<div class="route-node ' + (c.selected ? 'selected' : (c.eligible ? '' : 'rejected')) + '">' +
      '<strong class="mono">' + esc(c.nodeId) + '</strong> · ' +
      (c.selected ? 'Selected' : (c.eligible ? 'Eligible' : 'Rejected')) +
      (c.rejectReason ? ' — ' + esc(c.rejectReason) : '') +
      '<div class="muted">applied=' + esc(c.appliedTsId) + ' · inflight=' + esc(c.inflightReads) +
      ' · health=' + esc(c.healthStatus) + (c.healthLatencyMs != null ? ' · ' + fmtMs(c.healthLatencyMs) : '') +
      '</div></div>'
    ).join('') || '<div class="muted">No routing candidates (write path or primary-only).</div>';

    const span = spans.find(s => s.spanId === selectedSpanId) || spans[0];
    const spanDetail = span ? (
      '<div class="card detail-panel"><h2>Span</h2>' +
      '<div class="mono">' + esc(span.name) + '</div>' +
      '<div class="muted">' + esc(span.component) + ' · ' + statusBadge(span.status) + '</div>' +
      '<p class="mono">' + fmtMs(span.durationMs) + (span.nodeId ? ' · node ' + esc(span.nodeId) : '') + '</p>' +
      (span.errorMessage ? '<p class="err">' + esc(span.errorMessage) + '</p>' : '') +
      '<pre class="code">' + esc(JSON.stringify(span.attributes || {}, null, 2)) + '</pre></div>'
    ) : '';

    root.innerHTML =
      '<div style="display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap">' +
      '<div><h1>Trace</h1><p class="muted mono">' + esc(t.traceId) +
      ' <button class="icon-btn" id="copyTid">Copy</button></p></div>' +
      '<button class="btn" id="backTraffic">Back to traffic</button></div>' +
      '<div class="grid">' +
        kpi('Status', t.status) + kpi('Kind', t.kind) + kpi('Duration', fmtMs(t.durationMs)) +
        kpi('Node', t.selectedNodeId || '—') + kpi('Spans', t.spanCount) + kpi('Errors', t.errorSpanCount) +
        kpi('Consistency', t.consistencyMode || '—') + kpi('Started', fmtTime(t.startUtc)) +
      '</div>' +
      (t.incomplete ? '<p class="warn">This trace was marked incomplete when stored.</p>' : '') +
      '<div class="split">' +
        '<div><div class="card"><h2>Waterfall</h2><div class="waterfall">' + waterfall + '</div></div>' +
        '<div class="card" style="margin-top:12px"><h2>Routing decision</h2><div class="muted" style="margin-bottom:8px">' +
        esc(t.routeReason || '—') + '</div><div class="route-flow">' + candidates + '</div></div>' +
        '<div class="card" style="margin-top:12px"><h2>SQL</h2><pre class="code">' + esc(t.sql || '—') +
        '</pre><button class="icon-btn" id="copySql" style="margin-top:8px">Copy SQL</button>' +
        '<h2 style="margin-top:14px">Parameters</h2><pre class="code">' + esc(JSON.stringify(t.parameters || {}, null, 2)) +
        '</pre><h2 style="margin-top:14px">Result</h2><div class="muted">rowsReturned=' + esc(t.rowsReturned ?? '—') +
        ' · rowsAffected=' + esc(t.rowsAffected ?? '—') + '</div>' +
        '<pre class="code">' + esc(JSON.stringify(t.resultSample || [], null, 2)) + '</pre>' +
        (t.errorMessage ? '<p class="err">' + esc(t.errorMessage) + '</p>' : '') +
        '</div></div>' +
        spanDetail +
      '</div>';

    $('copyTid').onclick = () => navigator.clipboard.writeText(t.traceId);
    $('copySql').onclick = () => navigator.clipboard.writeText(t.sql || '');
    $('backTraffic').onclick = () => go('traffic');
    root.querySelectorAll('.wf-row').forEach(row => {
      row.onclick = () => { selectedSpanId = row.getAttribute('data-sid'); paintTrace(root); };
    });
  }

  async function paintReplication(root) {
    const res = await fetchJson(BASE + '/api/replication');
    const m = res.body || {};
    const cards = (m.extensions || []).map(e => {
      const logs = e.pendingLogs || [];
      const logHtml = logs.length
        ? '<div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>TSID</th><th>When</th><th>SQL still not applied</th></tr></thead><tbody>' +
          logs.map(p => '<tr><td class="mono">' + esc(p.tsId) + '</td><td class="mono">' + esc(fmtTime(p.commitTimestampUtc)) +
            '</td><td class="mono" style="white-space:pre-wrap">' + esc(p.sql || '') + '</td></tr>').join('') +
          '</tbody></table></div>'
        : '<p class="muted" style="margin:8px 0 0">' + (e.inSync ? 'No pending log entries. This replica matches primary.' : 'No log rows returned.') + '</p>';
      return '<article class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center">' +
        '<h2 class="mono" style="margin:0">' + esc(e.id) + '</h2>' + statusBadge(e.syncStatus || 'Unknown') + '</div>' +
        '<p class="muted">Applied TSID ' + esc(e.appliedTsId) + ' · Primary TSID ' + esc(e.latestTsId) +
        ' · <strong>' + esc(e.lag) + '</strong> log entr' + (e.lag === 1 ? 'y' : 'ies') + ' behind</p>' +
        logHtml + '</article>';
    }).join('') || '<div class="empty">No replicas configured. Reads stay on primary.</div>';
    root.innerHTML = '<h1>Replication</h1><p class="muted">Each replica shows how many transaction-log entries it has not applied yet, and the SQL of those entries.</p>' +
      '<div class="grid">' +
        kpi('Latest TSID', m.latestTsId) + kpi('Pending estimate', m.pendingEstimate) +
        kpi('Failed applies', m.failedApplies) +
      '</div><div style="display:grid;gap:12px">' + cards + '</div>';
  }

  async function paintAnalytics(root) {
    const res = await fetchJson(BASE + '/api/analytics/queries');
    const a = (res.body && res.body.analytics) || {};
    const table = (title, rows) => '<div class="card"><h2>' + title + '</h2>' +
      (!rows || !rows.length ? '<div class="muted">No data yet.</div>' :
      '<div class="table-wrap"><table><thead><tr><th>Shape</th><th>Count</th><th>Fail</th><th>Avg</th><th>P95</th></tr></thead><tbody>' +
      rows.map(r => '<tr class="clickable" data-tid="' + esc(r.sampleTraceId || '') + '"><td class="mono">' + esc(r.sqlShape) +
        '</td><td>' + esc(r.count) + '</td><td>' + esc(r.failures) + '</td><td>' + fmtMs(r.avgMs) +
        '</td><td>' + fmtMs(r.p95Ms) + '</td></tr>').join('') + '</tbody></table></div>') + '</div>';
    root.innerHTML = '<h1>Query Analytics</h1><p class="muted">Computed only from stored traces — never estimated.</p>' +
      '<div class="grid">' +
        kpi('Completed', a.totalCompleted ?? 0) + kpi('Failed', a.failed ?? 0) +
        kpi('Avg', a.avgDurationMs != null ? fmtMs(a.avgDurationMs) : '—') +
        kpi('P50', a.p50Ms != null ? fmtMs(a.p50Ms) : '—') +
        kpi('P95', a.p95Ms != null ? fmtMs(a.p95Ms) : '—') +
        kpi('P99', a.p99Ms != null ? fmtMs(a.p99Ms) : '—') +
      '</div>' +
      table('Slow queries', a.slowQueries) + table('Most executed', a.mostExecuted) + table('Failed queries', a.failedQueries);
    root.onclick = (e) => {
      const tr = e.target.closest('tr[data-tid]');
      const tid = tr && tr.getAttribute('data-tid');
      if (tid) go('trace', tid);
    };
  }

  async function paintConsistency(root) {
    const res = await fetchJson(BASE + '/api/consistency');
    const m = res.body || {};
    const reasons = m.routeReasons || {};
    root.innerHTML = '<h1>Consistency</h1><div class="grid">' +
      kpi('Mode', m.consistencyMode) + kpi('Primary reads', m.primaryReads) +
      kpi('Extension reads', m.extensionReads) + kpi('Fallbacks', m.primaryFallbacks) +
      '</div><div class="card"><h2>Route reasons</h2><pre class="code">' + esc(JSON.stringify(reasons, null, 2)) + '</pre></div>';
  }

  async function paintConnections(root) {
    const res = await fetchJson(BASE + '/api/connections');
    const ext = (res.body && res.body.extensions) || [];
    root.innerHTML = '<h1>Connections</h1><p class="muted">In-flight lease counts from the extension registry.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Extension</th><th>Online</th><th>Inflight</th><th>Apply failures</th></tr></thead><tbody>' +
      ext.map(e => '<tr><td class="mono">' + esc(e.id) + '</td><td>' + statusBadge(e.isOnline ? 'Online' : 'Offline') +
        '</td><td class="mono">' + esc(e.inflightReads) + '</td><td class="mono">' + esc(e.applyFailures) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  async function paintEvents(root) {
    const res = await fetchJson(BASE + '/api/events');
    const m = res.body || {};
    root.innerHTML = '<h1>Errors & Events</h1>' +
      '<div class="card"><h2>Recent errors</h2><pre class="code">' + esc((m.errors || []).join('\n') || 'None') + '</pre></div>' +
      '<div class="card" style="margin-top:12px"><h2>Engine events</h2><pre class="code">' +
      esc(JSON.stringify(m.engine || [], null, 2)) + '</pre></div>' +
      '<div class="card" style="margin-top:12px"><h2>Health history</h2><pre class="code">' +
      esc(JSON.stringify(m.health || [], null, 2)) + '</pre></div>';
  }

  async function paintHealth(root) {
    const res = await fetchJson(BASE + '/api/health');
    const m = res.body || {};
    root.innerHTML = '<h1>Health Checks</h1><p class="muted">Probe results (SELECT 1), independent of request traffic.</p>' +
      (!m.available ? '<div class="empty">Health monitor not registered.</div>' :
      '<div class="table-wrap"><table><thead><tr><th>Node</th><th>Role</th><th>Status</th><th>Latency</th><th>Last check</th><th>Error</th></tr></thead><tbody>' +
      (m.nodes || []).map(n => '<tr><td class="mono">' + esc(n.nodeId) + '</td><td>' + esc(n.role) + '</td><td>' +
        statusBadge(n.status) + '</td><td class="mono">' + fmtMs(n.latencyMs) + '</td><td class="mono">' +
        esc(fmtTime(n.lastCheckUtc)) + '</td><td class="err">' + esc(n.lastError || '') + '</td></tr>').join('') +
      '</tbody></table></div>');
  }

  async function paintConfig(root) {
    const res = await fetchJson(BASE + '/api/config');
    root.innerHTML = '<h1>Configuration</h1><p class="muted">Non-secret options only.</p><pre class="code">' +
      esc(JSON.stringify(res.body || {}, null, 2)) + '</pre>';
  }

  $('saveKey').onclick = () => {
    try { sessionStorage.setItem('hihooi-dashboard-key', $('apiKey').value || ''); } catch {}
    paint();
  };
  $('apiKey').value = apiKey();
  $('themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('hihooi-dashboard-theme', cur); } catch {}
  };

  async function connectHub() {
    try {
      if (!window.signalR) { $('connPill').textContent = 'Polling'; return; }
      const conn = new signalR.HubConnectionBuilder()
        .withUrl(BASE + '/hubs/metrics', {
          accessTokenFactory: () => apiKey(),
          headers: apiKey() ? { 'X-Hihooi-Dashboard-Key': apiKey() } : {}
        })
        .withAutomaticReconnect()
        .build();
      conn.on('metrics', (m) => { live = m; $('connPill').className = 'pill live'; $('connPill').textContent = 'Live'; });
      conn.on('traffic', (payload) => {
        if (page === 'traffic' && payload && payload.items) {
          trafficCache = payload.items;
        }
      });
      await conn.start();
      $('connPill').className = 'pill live';
      $('connPill').textContent = 'Live';
    } catch {
      $('connPill').textContent = 'Polling';
    }
  }

  renderNav();
  paint();
  connectHub();
  setInterval(() => {
    if (page === 'traffic' || page === 'overview' || page === 'nodes' || page === 'health') paint();
  }, 3000);
})();
  </script>
</body>
</html>
